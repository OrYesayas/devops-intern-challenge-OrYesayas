services:
  backend:
    build:
      context: ./backend
    # Published for local debugging: curl http://localhost:8080/health
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  proxy:
    build:
      context: ./proxy
    # Published for local debugging: curl http://localhost:8081/nginx-health
    ports:
      - "8081:80"
    depends_on:
      - backend

  test-runner:
    build:
      context: ./test-runner
    depends_on:
      - proxy
    environment:
      - PROXY_URL=http://proxy:80
