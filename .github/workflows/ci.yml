name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute test suite
        run: ./scripts/run-tests.sh
